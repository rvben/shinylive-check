name: Release

# Triggered by a version tag (`vership bump patch` pushes one). Re-runs the CI
# targets on the tagged commit, builds the distribution once, publishes it to
# PyPI through trusted publishing (no token: the repository must be registered
# as a trusted publisher for the `shinylive-check` project on PyPI, environment
# `pypi`), and creates the GitHub release with the CHANGELOG.md section as body.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: true

      - name: Tag matches pyproject.toml
        run: make check-version VERSION="${GITHUB_REF_NAME#v}"

      - name: CHANGELOG.md has a section for this version
        run: make release-notes VERSION="${GITHUB_REF_NAME#v}"

      - run: make lock-check
      - run: make sync
      - run: make lint
      - run: make typecheck
      - run: make test
      - run: make browsers PLAYWRIGHT_ARGS=--with-deps
      - run: make test-browser
      - run: make check-floor PLAYWRIGHT_ARGS=--with-deps

  build:
    name: Build
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: true

      # check-wheel builds dist/ and runs the suite against the installed wheel,
      # so what is uploaded below is what was tested.
      - run: make check-wheel

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/shinylive-check/
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - run: make publish

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Extract release notes from CHANGELOG.md
        run: make release-notes VERSION="${GITHUB_REF_NAME#v}"

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: tmp/release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
